<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShakeClock schedule</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 1.5rem auto; max-width: 62rem; padding: 0 1rem; }
  header { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  #state { font-weight: 600; }
  #state.connected { color: #1a7f37; }
  #state.connecting { color: #9a6700; }
  #state.disconnected { color: #666; }
  #dirty { color: #9a6700; font-weight: 600; }
  #msg { min-height: 1.4em; margin: .6rem 0; }
  #msg.ok { color: #1a7f37; }
  #msg.err { color: #cf222e; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #d0d7de; padding: .25rem .4rem; text-align: center; }
  th:first-child { text-align: left; }
  td.dup { background: #ffebe9; }
  td.changed { box-shadow: inset 0 0 0 2px #bf8700; }
  td.unused input[type=time] { color: #888; }
  button { padding: .35rem .9rem; }
</style>
</head>
<body>
<h1>ShakeClock alarm schedule</h1>
<header>
  <button id="connect">Connect</button>
  <button id="upload" disabled>Upload</button>
  <span id="state" class="disconnected">disconnected</span>
  <span id="dirty" hidden>modified, not saved to the clock</span>
</header>
<p id="msg" role="status"></p>
<table id="grid"></table>
<script type="module" src="app.js"></script>
</body>
</html>
