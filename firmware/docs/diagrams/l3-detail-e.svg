ORT, każde zbocze DCF_OUT):</text><text x="1492.4" y="126.078" fill="#000" font-size="21.667" textLength="344.985" font-family="DejaVu Serif">narastające: zapisz czas i okres</text><text x="1492.4" y="151.3" fill="#000" font-size="21.667" textLength="352.253" font-family="DejaVu Serif">od poprzedniego narastającego;</text><text x="1492.4" y="176.521" fill="#000" font-size="21.667" textLength="488.442" font-family="DejaVu Serif">opadające: szerokość = teraz − narastające;</text><text x="1492.4" y="201.742" fill="#000" font-size="21.667" textLength="459.581" font-family="DejaVu Serif">poprzedni impuls nieodebrany → overrun,</text><text x="1492.4" y="226.964" fill="#000" font-size="21.667" textLength="506.374" font-family="DejaVu Serif">inaczej s_pending = true dla dcf77_sync_step.</text></g><g class="start_entity" data-qualified-name=".start." id="ent0007" data-source-line="26"><ellipse cx="1406.95" cy="156.412" rx="16.667" ry="16.667" fill="#222" style="stroke:#222;stroke-width:1.667;"/></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="60"><path d="M1315.1,594.295 L1315.1,686.626 L1768.791,686.626 L1768.791,610.962 L1752.125,594.295 L1315.1,594.295" style="stroke:#181818;stroke-width:0.833;" fill="#FAFAFA"/><path d="M1752.125,594.295 L1752.125,610.962 L1768.791,610.962 L1752.125,594.295" style="stroke:#181818;stroke-width:1.667;" fill="#FAFAFA"/><text x="1325.1" y="622.74" fill="#000" font-size="21.667" textLength="388.223" font-family="DejaVu Serif">Limit 5 min działa w każdym stanie</text><text x="1325.1" y="647.962" fill="#000" font-size="21.667" textLength="389.757" font-family="DejaVu Serif">okna (RECEIVE, WAIT_START też):</text><text x="1325.1" y="673.183" fill="#000" font-size="21.667" textLength="418.691" font-family="DejaVu Serif">REJECTED (timeout), close_window().</text></g><!--link *start* to Off--><g class="link" data-entity-1="ent0007" data-entity-2="ent0001" id="lnk8" data-source-line="26" data-link-type="dependency"><pat